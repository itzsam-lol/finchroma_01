[project]
name = "finchrona"
version = "1.0.0"
description = "FinChrona: open financial time series (US Treasury yield curves)"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "pyarrow>=14", "requests>=2.28"]

[project.optional-dependencies]
dev = ["pytest>=7", "matplotlib>=3.7"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
